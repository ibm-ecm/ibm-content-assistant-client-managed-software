apiVersion: operator.ibm.com/v1
kind: IBMServiceMeterDefinition
metadata:
  name: ica-genai-metrics
  namespace: {{ namespace }}
spec:
  mappingId: cacmdeployment000000000001
  processing: LAST
  repeat: true
  breakdownDefs:
    - breakdownBy:
        name: INSTANCE_COUNT
      groupBy:
        - version
        - environment
        - architecture
        - platform
        - indexing
        - indexedDocs
        - indexedChunks
        - textQuery
        - ragQuery
        - compare
        - summary
      source: metricQuantity
      processing: LAST
  data:
    productId: a516ed219c22455093447670c3896299
    productName: IBM Content Assistant Client Managed Software
    metricName: INSTANCE_COUNT
    metricDescription: count of GenAI instances
    metricType: CONTRACTUAL
