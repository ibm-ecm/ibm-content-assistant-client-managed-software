apiVersion: opensearch.cloudpackopen.ibm.com/v1
kind: Cluster
metadata:
  annotations:
    productID: 068a62892a1e4db39641342e592daa25
    productMetric: FREE
    productName: IBM Cloud Platform Common Services
  name: ica-opensearch
  namespace: REPLACE_NAMESPACE # Replace with your CP4BA namespace
  labels:
    app.kubernetes.io/instance: single
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: cluster
    app.kubernetes.io/part-of: ibm-opensearch-operator
spec:
  backup:
    brConfigmapPriority: 100
    checkpointConfigmapPriority: 100
    enable: true
    sizeLimit: 50Gi
    snapshotPVC: ''
    snapshotPVCStorageClass: REPLACE_STORAGECLASS # Replace with your storage class
    snapshotWhitelistIndices: ''
  enableDefaultNetworkPolicy: false
  license:
    accept: true
  nodePools:
    - resources:
        limits:
          cpu: '2'
          ephemeral-storage: 5Gi
          memory: 2Gi
        requests:
          cpu: 500m
          ephemeral-storage: 10Mi
          memory: 820Mi
      opensearchyml: |
        plugins.security.ssl.http.enabled: true
        plugins.security.allow_default_init_securityindex: true
        plugins.security.restapi.roles_enabled: ["all_access", "security_rest_api_access"]
        plugins.security.unsupported.restapi.allow_securityconfig_modification: true
        http.compression: false
        plugins.security.ssl.http.clientauth_mode: OPTIONAL
        plugins.security.authcz.admin_dn: [CN=Cluster]
        knn.memory.circuit_breaker.enabled: true
        knn.memory.circuit_breaker.limit: 50%
        action.auto_create_index: "+ibm-genai-*,-*"
      name: all
      captureContainerLogLimit: 30
      enableInstanaMetricCollection: false
      resetUsers: false # Important: Prevents user data loss on pod restart
      storage:
        data:
          sizeLimit: 50Gi
          storageClass: REPLACE_BLOCK_STORAGECLASS  # Replace with your storage class
          useEphemeral: false
        deployment:
          sizeLimit: 10Gi
          storageClass: REPLACE_BLOCK_STORAGECLASS  # Replace with your storage class
          useEphemeral: false
      replicas: 3
  plugins:
    security:
      enabled: true
      httpCertificateSecret: ica-opensearch-tls-secret
      internalUserSecret: ica-opensearch-admin-user-secret
      version: 3.5.0.0 # Match with your OpenSearch operator version
    knn:
      enabled: true
      version:  3.5.0.0 # Match with your OpenSearch operator version
    mapperSize: false
    queryInsights: false
    mapperAnnotatedText: false
    analysisKuromoji: false
    discoveryEc2: false
    telemetryOtel: false
    storeSMB: false
    ingestAttachment: false
    repositoryS3: true
    transportReactorNetty4: false
    transportNio: false
    cryptoKms: false
    analysisUkrainian: false
    mapperMurmur3: false
    discoveryAzureClassic: false
    identityShiro: false
    analysisNori: false
    analysisSmartcn: false
    discoveryGce: false
    analysisStempe: false
    analysisPhonetic: false
    cacheEhcache: false
    analysisICU: false
  quiesce: false
  serviceAccount: ''
  version: 3.5.0 # Match with your OpenSearch operator version