apiVersion: operator.ibm.com/v1
kind: IBMServiceMeterDefinition
metadata:
  name: ica-genai-metrics
  namespace: REPLACE_NAMESPACE
spec:
  mappingId: cacmdeployment000000000001
  processing: LAST
  repeat: true
  breakdownDefs:
    - breakdownBy:
        name: AUTHORIZED_USER
      groupBy:
        - version
        - environment
        - architecture
        - platform
        - indexing
        - indexedDocs
