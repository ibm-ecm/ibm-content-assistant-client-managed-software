apiVersion: cas.ibm.com/v1
kind: CASCluster
metadata:
  name: casdeploy
  labels:
    app.kubernetes.io/instance: ibm-cas
    app.kubernetes.io/managed-by: ibm-cas
    app.kubernetes.io/name: ibm-cas
    release: 1.0.1
spec:
  ## The version of the Content Assistant operator that is being used.
  appVersion: 1.0.0

  ## MUST exist, used to accept ibm license; valid value only can be "true"
  license:
    accept:

  ##############################################################
  ## Shared configuration for all Content Assistant components #
  ##############################################################
  shared_configuration:
    ## Choose the licensing model for the Content Assistant components.
    ## Valid values are:
    ## "fncm" for IBM FileNet Content Manager,
    sc_cas_license_type: "fncm"

    ## All Content Assistant components must use/share the image_pull_secrets to pull images.
    image_pull_secrets:
      - ibm-entitlement-key

    ## All Content Assistant components must use/share the same docker image repository.  For example, if IBM Entitlement Registry is used, then
    ## it should be "cp.icr.io".  Otherwise, it will be a private registry.
    sc_image_repository: cp.icr.io

    ## All Content Assistant components must use/share the root_ca_secret in order for integration
    root_ca_secret: cas-root-ca

    ## Optional: You can specify a profile size for Content Assistant - valid values are small,medium,large - default is small.
    sc_deployment_profile_size: small

    ## Specify the RunAsUser for the security context of the pod.  This is usually a numeric value that corresponds to a user ID.
    ## For non-OCP (e.g., CNCF platforms such as EKS, AKS, GKE, etc.), this parameter is optional. It is not supported on OCP and ROKS.
    sc_run_as_user:

    ## Specify the fsGroup for the security context of the pod.  This is usually a numeric value that corresponds to a group ID.
    ## For non-OCP (e.g., CNCF platforms such as EKS, AKS, GKE, etc.), this parameter is optional. It is not supported on OCP and ROKS.
    sc_fs_group:

    ## The platform to be deployed specified by the user.  Possible values are: OCP, ROKS, and other.
    sc_deployment_platform: "<Required>"

    ## If the root certificate authority (CA) key of the external service is not signed by the operator root CA key, provide the TLS certificate of
    ## the external service to the component's truststore.
    trusted_certificate_list: [ ]

    ## Optional setting for secure computing mode (seccomp) profile for Content Assistant containers.  The default seccomp profile is RuntimeDefault on OCP 4.11 (k8s v1.24) or higher. seccomp profile won't be created on OCP 4.10 (k8s v1.23) or lower.
    ## For more information on seccomp please refer to https://kubernetes.io/docs/tutorials/security/seccomp/ and https://docs.openshift.com/container-platform/4.12/security/seccomp-profiles.html
    ## NOTE: Defining a custom, localhost seccomp profile that is stricter than the default RuntimeDefault profile may cause our pods fail to start.  This custom profile should be created at the worker nodes.
    sc_seccomp_profile:
    #  type: # RuntimeDefault, Localhost, Unconfined
    #  localhost_profile: # Local path of custom seccomp profile when type `Localhost` is used. The custom profile must be accessible by the pod and must exist locally on all worker nodes.  For example: `/profiles/fine-grained.json`.

    ## Provide the storage class name for the file storage provisioner.
    ## Operator will use the provided storage classes to provision required PVC volumes.
    storage_configuration:
      sc_slow_file_storage_classname: "<Required>"

    ## For CNCF, this is used to enable the creation of ingresses. The default value is "false".
    sc_ingress_enable: false

    ## Service type to support CNCF Ingress creation, possible values are ClusterIP, NodePort
    sc_service_type: ClusterIP

    ## For ROKS and CNCF Ingress, provide TLS secret name for Ingress controller.
    sc_ingress_tls_secret_name: "<Required>"

    ## OCP: Hostname suffix added to the default ingress hostname, this is optional and the default hostname suffix will be {meta.namespace}.
    ## CNCF: Hostname used to access your deployment. This is required for ingress creation.
    sc_deployment_hostname_suffix: "{{ meta.namespace }}"

    ## In case any custom annotation is needed for the environment provide below.
    ##  sc_ingress_annotations:
    ##   - kubernetes.io/ingress.class: nginx
    sc_ingress_annotations:

    ## This optional property is a string value corresponding to the "ipFamilyPolicy" property of Kubernetes "service" objects.
    ## Ref: https://kubernetes.io/docs/reference/kubernetes-api/service-resources/service-v1/
    ## This setting is only applicable in dual-stack clusters where both IPv4 and IPv6 are enabled.
    ## If not set, then the "ipFamilyPolicy" property of the services will default to the cluster-level settings.
    ## ALLOWED VALUES (case-sensitive): "PreferDualStack", "RequireDualStack"
    ## WARNING: Setting this property to a value not supported by your cluster will cause Content Assistant deployment to fail.
    ## For example, if your cluster only supports one IP family, using "RequireDualStack" will cause deployment to fail.
    sc_service_ip_family_policy:

    ## This optional property is a list value corresponding to the "ipFamilies" property of Kubernetes "service" objects.
    ## Ref: https://kubernetes.io/docs/reference/kubernetes-api/service-resources/service-v1/
    ## This parameter works in conjunction with the ipFamilyPolicy to define the IP addressing behaviors for the Service.
    ## If not set, then the "ipFamilies" property of the services will default to the cluster-level settings.
    ## ALLOWED VALUES (case-sensitive):
    ##   If "sc_service_ip_family_policy: PreferDualStack" or "RequireDualStack", then a list of two IP families supported by your cluster in desired order ("IPv6", "IPv4")
    ## WARNING: Setting this property to a value not supported by your cluster will cause Content Assistant deployment to fail.
    ## For example, if your cluster does not support "IPv6" family, then including "IPv6" in this property will cause deployment to fail.
    ## IMPORTANT: This setting is only supported for initial deployment. Updating this property after deployment has completed may
    ## cause system instability and require some pods (such as "ibm-nginx") to be manually restarted.
    sc_service_ip_families:

    ## If a cluster is configured for multiple availability zones (AZ) and the parameter sc_is_multiple_az is set to true, then the pods are spread across all the zones.
    ## By default, the sc_is_multiple_az parameter is set to false. When the value is set to true, the pods of the Content Assistant deployment are spread across your user-defined topology domains.
    ## The pod API includes a spec.topologySpreadConstraints field, which is used by the Content Assistant operator to configure it.
    sc_is_multiple_az: false

    ## The optional parameter to enable/disable the creation of sample network policy templates for Content Assistant components.  If the parameter is not defined, then the default value is "false".
    ## Set this flag to "true" if you plan to have restricted network policies in Content Assistant namespaces so that the operators can create sample network policy templates for Content Assistant components.
    ## Please refer to the Content Assistant documentation for more information about how to retrieve and apply the sample network policy templates.
    sc_generate_sample_network_policies: false

    sc_egress_configuration:
      ## Optional.  Kubernetes API server namespace(s) (comma separated) to be used for egress network policy when `sc_restricted_internet_access: true` and `sc_deployment_platform: "other"`.
      ## "{}" can also be used as a value.  It is equivalent to all namespaces (eg: namespaceSelector:{})
      ## Default are "openshift-kube-apiserver", "openshift-apiserver" for OCP and ROKS.
      ## Possible values are "kube-system", "default", "kube-public" for other.
      sc_api_namespace:
      ## Optional.  Kubernetes API server port(s) (comma separated) to be used for egress network policy when `sc_restricted_internet_access: true` and `sc_deployment_platform: "other"`.
      ## Default are 443, 6443 for OCP, ROKS, other
      sc_api_port:
      ## Optional.  Kubernetes DNS service namespace(s) (comma separated) to be used for egress network policy when `sc_restricted_internet_access: true` and `sc_deployment_platform: "other"`.
      ## "{}" can also be used as a value.  It is equivalent to all namespaces (eg: namespaceSelector:{})
      ## Default is "openshift-dns" for OCP and ROKS.
      ## Possible values are "kube-system", "default", "kube-public" for other.
      sc_dns_namespace:
      ## Optional.  Kubernetes DNS service port(s) (comma separated) to be used for egress network policy when `sc_restricted_internet_access: true` and `sc_deployment_platform: "other"`.
      ## Default are 53, 5353 for OCP, ROKS and other
      sc_dns_port:    

  #############################################
  ######## Vector Database Configuration ######
  #############################################
  vector_database:
    # The type of Vector Database to be used. Currently, only "opensearch" is supported.
    vector_database_type: "opensearch"
    # The secret name that contains the Vector Database credentials.
    vector_database_secret_name: vector-database-secret
    # Vector Database URL which should include host and port. Example https://<VectorDatabaseURL>:9200
    vector_database_url: "<Required>"
    # Vector Database ssl_enabled parameter is used to support database connection over SSL
    vector_database_ssl_enabled: true
    # Secret that contains the Vector Database certificate. Secret should be created with the key tls.crt
    vector_database_certificate: vector-database-certificate-secret
    # Vector Database Authentication type. 2 possible types -  Basic Authentication ( BASICAUTH ) or OIDC
    vector_database_auth_type: BASICAUTH
    ## Vector Database token endpoint required only if OIDC has been selected as the vector database authentication method
    vector_database_oidc_token_endpoint: ""
    ## Vector Database OIDC certificate secret required only if OIDC has been selected as the vector database authentication method
    vector_database_oidc_certificate: vector-database-oidc-certificate-secret

    ## OIDC Tuning parameters
    vector_database_oidc_lock_acq_timeout_sec:
    vector_database_oidc_scope: "email profile"
    vector_database_oidc_token_expiry_buffer_sec:
    vector_database_oidc_verify_certs: false

    # Vector Database Tuning parameters
    vector_database_max_pool_size:
    vector_database_verify_certs: false
    vector_database_ssl_assert_hostname: false
    vector_database_ssl_show_warn: false
    vector_database_max_retries:
    vector_database_timeout:
    vector_database_retry_on_timeout:

  ###################################################
  ######## IBM Content Assistant Configuration ######
  ###################################################
  content_assistant_configuration:
    ## The secret name that contains watson API credentials.
    content_assistant_secret_name: ibm-content-assistant-secret

    ## The architecture of the cluster.
    arch:
      amd64: "3 - Most preferred"

    ##-------------------------------------
    ## custom_node_selector_match_expression will be added in node selector match expressions.
    ## It accepts array list inputs. You can assign multiple selector match expressions except (kubernetes.io/arch)
    ## Example value:
    ## - key: kubernetes.io/hostname
    ##   operator: In
    ##   values:
    ##     - worker0
    ##     - worker1
    ##     - worker3
    ##-------------------------------------
    node_affinity:
      custom_node_selector_match_expression: []

    ## Values in this field will be used as annotations in all generated pods, and it must be valid annotation key value pairs.
    # Example:
    # customAnnotationKey: customAnnotationValue
    ## To include '{{ }}' in annotation like '{{example}}', add a backward slash before curly brace like '\{\{example\}\}'.
    custom_annotations: { }
    ## Values in this field will be used as labels in all generated pods, and it must be valid label key value pairs
    # Example:
    # customLabelKey: customLabelValue
    custom_labels: { }

    ## The number of replicas or pods to be deployed.  The default is 1 replica and for high availability in a production env,
    ## it is recommended to have 2 or more.
    replicas: 2

    ## Rolling update settings for Content Assistant deployment.  By default, max_unavailable is set to 99% and max_surge is set to 1.
    ## Valid values for max_unavailable are 0-100% or 0-<number of replicas>.  Valid values for max_surge are 0-100% or 0-<number of replicas>.
    rolling_update:
      max_unavailable: 99%
      max_surge: 1

    ## This is the image repository and tag that correspond to image registry, which is where the image will be pulled.
    image:
      ## The default repository is the IBM Entitled Registry.
      repository: cp.icr.io/cp/cas/genaiconnector
      tag: "1.0.1"

      ## This will override the image pull policy in the shared_configuration.
      pull_policy: IfNotPresent

    ## Set securityContext for Content Assistant deployment.
    security_context:
      supplemental_group:
      ## This can take an array of key value pairs to assign SELinux labels to a Container, for example
      ## selinux_options:
      ## level: "s0:c123,c456"
      ## type: "spc_t
      selinux_options:
      # Defines behavior for changing ownership and permission of the volume before being exposed inside a Pod. This field has two possible values (Always,OnRootMismatch)
      # For example fs_groupchangepolicy: "OnRootMismatch"
      fs_groupchangepolicy:

    ## The initial resources (CPU, memory, and ephemeral storage) requests and limits.
    ## If more resources are needed, make the changes here to meet your requirement.
    resources:
      requests:
        cpu: 1
        memory: 3072Mi
        ephemeral_storage: 4Gi
      limits:
        cpu: 1
        memory: 3072Mi
        ephemeral_storage: 4Gi

    ## By default, "Autoscaling" is disabled (i.e., enabled: false).
    ## If you enable auto_scaling (i.e., enabled: true), be sure to
    ## provide values for max_replicas, min_replicas, and target_cpu_average_utilization.
    auto_scaling:
      enabled: false
      max_replicas: 3
      min_replicas: 1
      ## This is the default cpu percentage before autoscaling occurs.
      target_cpu_average_utilization: 80

    content_assistant_production_settings:
      ## Data prefix that the Content Assistant will use to create objects to be easily identifiable.
      data_index_prefix: "ibm-genai-"
      ## Data index that the Content Assistant will create.
      data_index: "ibm-genai-data_index"
      ## Metric index that the Content Assistant will create.
      data_metric_index: "ibm-genai-metric_index"

      # This section is used to configure Content Assistant CLI enablement and access token settings.
      cli:
        enabled: true
        # Validity of the access token
        access_token_expire_minutes: 60
        # Admin Role name associated with the access token
        access_token_role: ibm-genai-document-manager
        # Secret name that contains the private key and passphrase
        access_token_key_pem_secret: ibm-content-assistant-admin-key-secret

      startup:
        workers: 10
        limit_concurrency: 500
        limit_max_requests: 2000
        timeout_keep_alive: 30

      ## Set the logging level for the IBM Content Assistant
      ## Available values in the order of verbosity are 
      ## debug;info;warning;error;critical
      ## debug: Provides detailed information, primarily useful for diagnosing problems.
      ## info: Confirms that things are working as expected
      ## warning: Indicates that something unexpected happened or that a potential problem might arise in the near future, but the software is still functioning.
      ## error: Signifies a more serious problem that has prevented the software from performing a specific function
      ## critical: A serious error, indicating that the program itself may be unable to continue running.
      ## Default: info
      log_level: info

      ## This section is optional, and it takes a list of configmaps.
      ## A configmap can hold files or environment data, but it cannot a mix of both.
      ## The volume_path is optional for a configmap that holds files as its data and if it's not specified,
      ## then the files will be mounted to the overrides directory.
      ## If the configmap data holds environment variables then is_env is required and set it to true.
      #custom_configmap:
      # - name: <name of configmap>
      #   volume_path:  # optional
      # - name: <name of configmap>
      #   is_env: # required if the configmap holds environment variables.

    ## If the storage_configuration in the shared_configuration is configured,
    ## The Operator will create the PVC using the names below.
    datavolume:
      ## The PVC volume name and size for storing Content Assistant log files
      existing_pvc_for_content_assistant_logstore:
        name: "content-assistant-logstore"
        size: 1Gi

    ## Default values for both startup and liveness probes.  Modify these values to meet your requirements.
    probe:
      startup:
        initial_delay_seconds: 120
        period_seconds: 30
        timeout_seconds: 10
        failure_threshold: 40
      liveness:
        period_seconds: 30
        timeout_seconds: 5
        failure_threshold: 6
